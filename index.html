<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./index.css">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"> -->
</head>
<body>
    <div class="calculator">
        <h1>CALCULATOR</h1>
        <input type="text" id="inp1" disabled>
        <br>
        <div class="buttons">
            <button onclick="display('7')" class="button">7</button>
            <button onclick="display('8')" class="button">8</button>
            <button onclick="display('9')" class="button">9</button>

            <button onclick="display('/')" class="operator">/</button>
            
            <button onclick="display('4')" class="button">4</button>
            <button onclick="display('5')" class="button">5</button>
            <button onclick="display('6')" class="button">6</button>
            
            <button onclick="display('*')" class="operator">*</button>
            
            <button onclick="display('1')" class="button">1</button>
            <button onclick="display('2')" class="button">2</button>
            <button onclick="display('3')" class="button">3</button>
            
            <button onclick="display('-')" class="operator">-</button>
            
            <button onclick="display('0')" class="button">0</button>
            
            <button onclick="display('.')" class="button">.</button>
            
            <button onclick="calculate()" class="equal">=</button>
            
            <button onclick="display('+')" class="operator">+</button>
            
            <button onclick="deleteLast()" class="del">AC</button>
            
            <button onclick="clearScreen()" class="clr">C</button>
        </div>
    </div>
    <script src="./app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
